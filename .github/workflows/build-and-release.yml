name: Build and Release

on:
  workflow_dispatch:
  release:
    types: [published, prereleased]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]

    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}

    steps:
      - name: Get version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Detected version: $VERSION"

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go environment
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          check-latest: true

      - name: Build
        run: |
          BINARY="frankenphp-manager"
          ARCHIVE="frankenphp-manager_${{ matrix.goos }}_${{ matrix.goarch }}"
          
          go build -ldflags "-s -w -X 'main.version=${{ env.VERSION }}' -X 'main.goVersion=$(go version)' -X 'main.gitHash=$(git rev-parse HEAD)' -X 'main.buildTime=$(date -u +'%Y-%m-%dT%H:%M:%SZ')'" \
            -o "${BINARY}" cmd/server/main.go
          
          # Create package directory
          PKG_DIR="${ARCHIVE}_pkg"
          rm -rf "${PKG_DIR}"
          mkdir -p "${PKG_DIR}"
          
          # Copy files into package
          cp "${BINARY}" "${PKG_DIR}/frankenphp-manager"
          cp scripts/install.sh "${PKG_DIR}/"
          cp scripts/uninstall.sh "${PKG_DIR}/"
          cp scripts/frankenphp-manager-service.sh "${PKG_DIR}/"
          cp README.md "${PKG_DIR}/"
          cp LICENSE "${PKG_DIR}/"
          
          # Create archive
          tar -czvf "${ARCHIVE}.tar.gz" "${PKG_DIR}/"
          
          echo "ARCHIVE=${ARCHIVE}" >> $GITHUB_ENV

      - name: Upload files to Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}.tar.gz
          if-no-files-found: ignore

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./${{ env.ARCHIVE }}.tar.gz
          tag: ${{ github.ref }}
          overwrite: true
          file_glob: true
